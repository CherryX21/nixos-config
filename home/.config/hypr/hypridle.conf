general {
    ignore_dbus_inhibit = false

    # На случай системного lock-события
    lock_cmd = pidof swaylock || swaylock
}

# Через 1 минуту приглушаем экран
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Через 3 минуты выключаем экран
listener {
    timeout = 180
    on-timeout = sh -c 'hyprlock & sleep 0.3; niri msg action power-off-monitors'
    on-resume = niri msg action power-on-monitors
}
