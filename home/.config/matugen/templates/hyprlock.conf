$font = JetBrainsMono Nerd Font

$bg = rgba({{colors.surface.default.hex_stripped}}ff)
$surface = rgba({{colors.surface_container.default.hex_stripped}}dd)
$surface_hi = rgba({{colors.surface_container_high.default.hex_stripped}}ee)

$fg = rgba({{colors.on_surface.default.hex_stripped}}ff)
$primary = rgba({{colors.primary.default.hex_stripped}}ff)
$outline = rgba({{colors.outline.default.hex_stripped}}66)
$error = rgba({{colors.error.default.hex_stripped}}ff)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true

    bezier = smooth, 0.25, 1, 0.5, 1

    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth

    animation = inputFieldFade, 1, 5, smooth
    animation = inputFieldDots, 1, 4, smooth
    animation = inputFieldColors, 1, 4, smooth
}

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8

    brightness = 0.65
    contrast = 0.95
    vibrancy = 0.12
    vibrancy_darkness = 0.25
}

# Большие часы
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"

    color = $fg
    font_size = 120
    font_family = $font

    position = 0, 350
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"

    color = $primary
    font_size = 16
    font_family = $font

    position = 0, 250
    halign = center
    valign = center
}

# Welcome back
label {
    monitor =
    text = Welcome back

    color = $fg
    font_size = 35
    font_family = $font

    position = 0, -280
    halign = center
    valign = center
}

# Имя пользователя
label {
    monitor =
    text = $USER

    color = rgba({{colors.on_surface_variant.default.hex_stripped}}ff)
    font_size = 13
    font_family = $font

    position = 0, -350
    halign = center
    valign = center
}

# Парольная pill
input-field {
    monitor =

    size = 300, 52
    position = 0, -400

    halign = center
    valign = center

    outline_thickness = 1
    rounding = 26

    outer_color = $outline
    inner_color = $surface

    font_color = $fg

    check_color = $primary
    fail_color = $error

    dots_size = 0.24
    dots_spacing = 0.26
    dots_center = true

    fade_on_empty = true
    hide_input = false

    placeholder_text = <span foreground="##{{colors.on_surface_variant.default.hex_stripped}}">󰌾  Type to unlock</span>
    fail_text = <span foreground="##{{colors.error.default.hex_stripped}}">Wrong password</span>

    font_family = $font
}

# Current keyboard layout
label {
    monitor =
    text = $LAYOUT[EN,RU,UA]

    color = rgba({{colors.on_surface.default.hex_stripped}}cc)
    font_size = 14
    font_family = $font

    position = -28, 24
    halign = right
    valign = bottom
}
